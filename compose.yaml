services:
  hysteria-wui:
    image: ghcr.io/reansn0w/hysteria-wui:latest
    restart: unless-stopped
    network_mode: host
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      HYSTERIA_DISABLE_UPDATE_CHECK: "1"
      HWUI_DOMAIN: ${HWUI_DOMAIN:?set HWUI_DOMAIN}
      HWUI_ACME_EMAIL: ${HWUI_ACME_EMAIL:?set HWUI_ACME_EMAIL}
      HWUI_ADMIN_USER: ${HWUI_ADMIN_USER:?set HWUI_ADMIN_USER}
      HWUI_ADMIN_PASSWORD: ${HWUI_ADMIN_PASSWORD:?set HWUI_ADMIN_PASSWORD}
      HWUI_PANEL_PATH: ${HWUI_PANEL_PATH:?set HWUI_PANEL_PATH}
      HWUI_DECOY_URL: ${HWUI_DECOY_URL:?set HWUI_DECOY_URL}
    volumes:
      - type: bind
        source: ./runtime
        target: /var/lib/hysteria-wui
        bind:
          create_host_path: false

{{define "user"}}{{template "head" .}}{{template "nav" .}}
<main class="container page-shell py-4">
  <a class="text-decoration-none" href="{{.Base}}/users">← Все пользователи</a>
  <h1 class="h3 mt-3 mb-4">{{.User}}</h1>
  <div class="row g-4"><div class="col-lg-7"><div class="card"><div class="card-body">
    <h2 class="h5">Ссылка подключения</h2><p class="text-secondary">Импортируйте её в клиент с поддержкой Hysteria 2.</p>
    <textarea class="form-control secret-value mb-3" id="connection-uri" rows="5" readonly>{{.URI}}</textarea><button class="btn btn-primary" type="button" data-copy="#connection-uri">Скопировать</button>
  </div></div></div>
  <div class="col-lg-5"><div class="card"><div class="card-body text-center"><h2 class="h5">Быстрый импорт</h2><img class="img-fluid qr-code" src="{{.Base}}/users/{{.UserPath}}/qr.png" alt="QR-код для {{.User}}"><a class="btn btn-outline-secondary w-100 mt-3" href="{{.Base}}/users/{{.UserPath}}/qr.png" download="hysteria-qr.png">Скачать PNG</a></div></div></div></div>
</main>{{template "foot" .}}{{end}}

{{define "login"}}{{template "head" .}}
<main class="container login-shell py-4 py-sm-5">
  <div class="card shadow-sm"><div class="card-body p-3 p-sm-4">
    <h1 class="h3 mb-4">Hysteria WUI</h1>
    {{if .Error}}<div class="alert alert-danger" role="alert">Не удалось войти. Проверьте данные и повторите попытку.</div>{{end}}
    <form method="post" action="{{.Base}}/login">
      <div class="mb-3"><label class="form-label">Логин</label><input class="form-control" name="username" autocomplete="username" required autofocus></div>
      <div class="mb-4"><label class="form-label">Пароль</label><input class="form-control" type="password" name="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary w-100">Войти</button>
    </form>
  </div></div>
</main>{{template "foot" .}}{{end}}

name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:assets
      - name: Verify generated assets
        run: git diff --exit-code -- internal/panel/assets/vendor
      - name: Verify formatting
        run: |
          files="$(gofmt -l .)"
          test -z "$files" || { printf '%s\n' "$files"; exit 1; }
      - name: Verify Docker build context exclusions
        run: python3 scripts/check-dockerignore.py
      - name: Verify relay Compose
        run: docker compose --env-file relay/.env.example -f relay/compose.yaml config --quiet
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build relay image
        run: docker build --platform linux/amd64 --file relay/Dockerfile --tag hysteria-relay:test .

  publish:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Select image tags
        id: image
        shell: bash
        run: |
          short="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == "refs/heads/master" ]]; then
            printf 'publish=true\n' >> "$GITHUB_OUTPUT"
            printf 'main_tags<<EOF\nghcr.io/reansn0w/hysteria-wui:latest\nghcr.io/reansn0w/hysteria-wui:sha-%s\nEOF\n' "$short" >> "$GITHUB_OUTPUT"
            printf 'relay_tags<<EOF\nghcr.io/reansn0w/hysteria-relay:latest\nghcr.io/reansn0w/hysteria-relay:sha-%s\nEOF\n' "$short" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'publish=true\n' >> "$GITHUB_OUTPUT"
            printf 'main_tags<<EOF\nghcr.io/reansn0w/hysteria-wui:%s\nghcr.io/reansn0w/hysteria-wui:sha-%s\nEOF\n' "$GITHUB_REF_NAME" "$short" >> "$GITHUB_OUTPUT"
            printf 'relay_tags<<EOF\nghcr.io/reansn0w/hysteria-relay:%s\nghcr.io/reansn0w/hysteria-relay:sha-%s\nEOF\n' "$GITHUB_REF_NAME" "$short" >> "$GITHUB_OUTPUT"
          else
            printf 'publish=false\n' >> "$GITHUB_OUTPUT"
            echo "Tag is not an exact vX.Y.Z release tag; image publication is skipped."
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.image.outputs.publish == 'true'
      - uses: docker/login-action@v3
        if: steps.image.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.image.outputs.publish == 'true'
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.main_tags }}
          provenance: mode=max
          sbom: true
      - uses: docker/build-push-action@v6
        if: steps.image.outputs.publish == 'true'
        with:
          context: .
          file: relay/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.relay_tags }}
          provenance: mode=max
          sbom: true
